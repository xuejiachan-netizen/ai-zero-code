spring:
  application:
    name: yu-ai-code-mother-backend
  profiles:
    active:
      - local
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_zero_code
    username: root
    password:
server:
  port: 8110
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match:
        -  '/**'
      packages-to-scan:
        -  com.xuanjia.xuanjiazerocode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn